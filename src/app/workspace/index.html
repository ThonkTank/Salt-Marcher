<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self'; connect-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>SaltMarcher</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="player.css" />
  </head>
  <body>
    <!-- workspace:include header.html -->
    <div id="status" role="status" aria-live="polite">Kampagne öffnen oder neu anlegen.</div>
    <div id="commit-pending" role="status" aria-live="polite" hidden>
      <span id="commit-message"></span>
      <button id="commit-check" type="button">Buchungsstatus prüfen</button>
    </div>
    <div id="error-actions" hidden>
      <button id="reconcile">Speicherstatus prüfen</button
      ><button id="discard">Entwurf verwerfen und aktualisieren</button>
    </div>
    <div id="backup-status" role="status" hidden></div>
    <!-- workspace:include ../campaign/campaign-screen.html -->
    <section id="workspace-empty" aria-labelledby="workspace-empty-heading">
      <p class="workspace-empty-kicker">Kampagnenstart</p>
      <h2 id="workspace-empty-heading">Womit möchtest du beginnen?</h2>
      <p>
        Lege eine leere Kampagne an oder übernimm einen vorhandenen Dungeon. Die Arbeitsbereiche
        erscheinen, sobald eine Kampagne geöffnet ist.
      </p>
      <div class="workspace-empty-actions">
        <button id="workspace-new-campaign" type="button">Neue Kampagne anlegen</button>
        <button id="workspace-import" type="button">Dungeon übernehmen…</button>
      </div>
    </section>
    <!-- workspace:include ../runtime/party.html -->
    <!-- workspace:include ../runtime/adventuring-day.html -->
    <!-- workspace:include navigation.html -->
    <!-- workspace:include ../atlas/atlas.html -->
    <!-- workspace:include ../campaign/preparation.html -->
    <!-- workspace:include ../runtime/live.html -->
    <!-- workspace:include ../runtime/chronicle.html -->
    <section id="music" hidden></section>
    <section id="world" hidden></section>
    <!-- workspace:include ../campaign/groups.html -->
    <!-- workspace:include ../runtime/treasury.html -->
    <section id="items" hidden></section>
    <!-- workspace:include ../catalog/catalog.html -->
    <!-- workspace:include ../campaign/session-planning-dialogs.html -->
    <!-- workspace:include ../catalog/encounter-dialogs.html -->
    <!-- workspace:include ../campaign/preset-manager.html -->
    <!-- workspace:include ../runtime/combat-dialogs.html -->
    <!-- workspace:include ../runtime/party-dialogs.html -->
    <!-- workspace:include ../campaign/authoring-dialogs.html -->
    <!-- workspace:include extensions-dialog.html -->
    <!-- workspace:include tutorial-dialog.html -->

    <!-- workspace:include ../atlas/city.html -->

    <!-- workspace:include ../atlas/dungeon.html -->
    <!-- workspace:include ../runtime/autonomy.html -->
    <!-- workspace:include ../runtime/player-controls.html -->
    <!-- workspace:include ../campaign/campaign-transfer-dialogs.html -->
    <div id="music-mini" hidden></div>
    <script src="renderer.js" defer></script>
    <!-- workspace:include ../atlas/volume-dialog.html -->
    <!-- workspace:include ../atlas/path-dialog.html -->
    <!-- workspace:include ../campaign/key-dialog.html -->

</html>
