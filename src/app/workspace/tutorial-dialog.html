<p id="tutorial-warning" role="status"></p>
<dialog id="tutorial-dialog" aria-labelledby="tutorial-heading">
  <h2 id="tutorial-heading" tabindex="-1">Hilfe zu SaltMarcher</h2>
  <label for="tutorial-search">Hilfe durchsuchen</label
  ><input
    id="tutorial-search"
    type="search"
    placeholder="Zum Beispiel Party, Orte oder Speichern"
  />
  <p id="tutorial-search-status" class="caption" role="status"></p>
  <ol id="tutorial-lessons" tabindex="0" aria-label="Lerninhalte"></ol>
  <div class="actions">
    <button id="tutorial-skip">Schließen</button
    ><button id="tutorial-done">Als gelesen markieren</button>
  </div>
</dialog>
