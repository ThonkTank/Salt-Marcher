name: Repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  # Finish integration feedback even while other roles keep publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Candidate · exact-SHA aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact event commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation and source references
        run: npm run check:repo

      - name: Test capability catalog migration and concurrent selection
        run: python3 tools/agent-setup/test_select_capability.py

      - name: Test read-only heartbeat review cadence
        run: python3 tools/agent-setup/test_heartbeat_review.py

      - name: Check active source formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Type-check desktop
        run: npm run check:desktop

      - name: Build default application target
        run: npm run build

      - name: Build desktop application
        run: npm run build:desktop

      - name: Run complete test suite
        run: npm test

      - name: Install native E2E prerequisites
        run: |
          npx playwright-core install-deps chromium
          sudo apt-get install -y dbus xdg-dbus-proxy xvfb
          npm run desktop:runtime

      - name: Allow the Electron sandbox in the ephemeral runner
        run: |
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Reuse the exact desktop build above; the probe checks its source SHA and
      # runtime hashes and owns every Electron process in one isolated profile.
      - name: Test complete native E2E-01 technical catalogue
        timeout-minutes: 25
        env:
          QA_EVIDENCE_DIR: .build/e2e01-native
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1200x24' python3 tools/ui-session.py node tools/test-desktop-e2e01.mjs --software-gpu

      - name: Upload native E2E-01 evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-e2e01-${{ github.event.pull_request.head.sha || github.sha }}
          path: .build/e2e01-native
          include-hidden-files: true
          if-no-files-found: ignore
