name: Reproduzierbarer Fehler
description: Ein konkreter Fehler mit Build, Ablauf und erwartetem Ergebnis.
labels: ["bug", "kind:task"]
body:
  - type: input
    id: revision
    attributes:
      label: Commit / Build / Hostversion
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte und Testdaten
      description: Isolierte Reproduktion; keine privaten Karten oder Texte einfügen.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Erwartetes und beobachtetes Ergebnis
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Belege und betroffener Nutzerablauf
      description: Fehlerausgabe, zugängliche Belege, bestehendes Fachissue/PR und Abnahmegrenze.
