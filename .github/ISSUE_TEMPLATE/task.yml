name: Begrenzte Produktaufgabe
description: "Ein überprüfbares Ergebnis mit Voraussetzungen und Abnahme."
labels: ["kind:task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Nutzerergebnis
      description: "Welcher Nutzerablauf soll funktionieren?"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Betroffene Funktion und Voraussetzungen
      description: "Betroffene Funktionen, vorhandene Quellen und notwendige Testdaten nennen."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahme
      description: "Beobachtbares Ergebnis, geeignete Prüfung und offene Grenzen nennen."
    validations:
      required: true
