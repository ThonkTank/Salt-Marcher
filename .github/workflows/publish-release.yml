name: Publish accepted release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Qualified draft version'
        required: true
        type: string
      acceptance:
        description: 'Versioned live acceptance JSON with exact hashes, time, five completed checks and notes'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: salt-marcher-release
  cancel-in-progress: false
jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.draft.outputs.commit }}
      run_id: ${{ steps.draft.outputs.run_id }}
      artifact_name: ${{ steps.draft.outputs.artifact_name }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: draft
        name: Resolve the draft to its successful immutable qualification
        run: pnpm exec tsx scripts/resolve-draft-release.ts "$RUNNER_TEMP/draft-controls"
  publish:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      LIVE_ACCEPTANCE: ${{ inputs.acceptance }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.resolve.outputs.commit }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Download original qualified CI artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release/original-qualified
      - name: Download the draft and retain the submitted live acceptance
        run: |
          set -euo pipefail
          test "$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
          gh release download "v$RELEASE_VERSION" --dir release/draft
          node -e 'require("node:fs").writeFileSync("release/live-input.json", process.env.LIVE_ACCEPTANCE, {flag:"wx"})'
      - name: Verify original bytes, exact source, live evidence and actual human approval
        run: pnpm exec tsx scripts/verify-qualified-release.ts --directory release/draft --phase publish --reference release/original-qualified --acceptance release/live-input.json --receipt release/live-acceptance.json
      - name: Attach the verified acceptance and publish without rebuilding
        run: |
          set -euo pipefail
          gh release upload "v$RELEASE_VERSION" release/live-acceptance.json
          gh release edit "v$RELEASE_VERSION" --draft=false --latest
