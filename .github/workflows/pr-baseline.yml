name: Repository baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  # Finish integration feedback even while other roles keep publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Candidate · exact-SHA aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out exact event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact event commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation and source references
        run: npm run check:repo

      - name: Test capability catalog migration and concurrent selection
        run: python3 tools/agent-setup/test_select_capability.py

      - name: Test read-only heartbeat review cadence
        run: python3 tools/agent-setup/test_heartbeat_review.py

      - name: Type-check
        run: npm run check

      - name: Type-check desktop
        run: npm run check:desktop

      - name: Build historical adapter
        run: npm run build

      - name: Build desktop application
        run: npm run build:desktop

      - name: Run complete test suite
        run: npm test
