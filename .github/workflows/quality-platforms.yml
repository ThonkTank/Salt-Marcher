name: quality-platforms

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-platforms-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - run: ./gradlew check --rerun-tasks --console=plain
      - name: Extract allowlisted JUnit failure records
        if: failure()
        run: >-
          python3 tools/quality/extract_ci_failure_records.py
          --input-dir build/test-results/test
          --output build/ci-failure-records/records.json
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Retain allowlisted JUnit failure records
        if: failure() && hashFiles('build/ci-failure-records/records.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: check-failure-records-${{ github.run_id }}
          path: build/ci-failure-records/records.json
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
