name: Repository structure

on:
  push:
    branches: [active/installed-phase1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-structure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check repository structure
        run: npm run check:repo
      - name: Test the structural checks
        run: npm run test:repo
