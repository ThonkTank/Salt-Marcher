name: Check
on: [pull_request, push]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # windows-latest currently provides a Visual Studio version that node-gyp
      # cannot identify while compiling better-sqlite3.  Pin the supported
      # Windows 2022 image so native modules build reproducibly.
      matrix: { os: [ubuntu-latest, windows-2022, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm check
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm check
        if: matrix.os != 'ubuntu-latest'
      - run: xvfb-run -a pnpm test:packaged-smoke
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm test:packaged-smoke
        if: matrix.os != 'ubuntu-latest'
      - run: xvfb-run -a pnpm test:packaged-qualification-smoke
        if: matrix.os == 'ubuntu-latest'
      - run: pnpm test:packaged-qualification-smoke
        if: matrix.os != 'ubuntu-latest'
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:e2e
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-e2e-${{ github.run_id }}
          path: .tmp/visual-diffs
          if-no-files-found: ignore
      - run: xvfb-run -a pnpm test:passive-e2e
