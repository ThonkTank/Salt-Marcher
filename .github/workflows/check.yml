name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
env:
  SALT_MARCHER_CHECKED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  portable:
    if: github.event_name == 'pull_request'
    name: Portable · static and app
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm check:portable:fast

  native:
    if: github.event_name == 'pull_request'
    name: Native · ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            electron-cache: ~/AppData/Local/electron/Cache
            builder-cache: ~/AppData/Local/electron-builder/Cache
          - os: macos-latest
            electron-cache: ~/Library/Caches/electron
            builder-cache: ~/Library/Caches/electron-builder
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache native Electron toolchain
        uses: actions/cache@v4
        with:
          path: |
            ${{ matrix.electron-cache }}
            ${{ matrix.builder-cache }}
          key: native-${{ runner.os }}-${{ runner.arch }}-node22-pnpm10-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:native

  linux-build:
    if: github.event_name == 'pull_request'
    name: Linux build · reusable app
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      functional_e2e_matrix: ${{ steps.e2e_matrix.outputs.functional }}
      visual_e2e_matrix: ${{ steps.e2e_matrix.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache native Electron toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: native-${{ runner.os }}-${{ runner.arch }}-node22-pnpm10-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - id: e2e_matrix
        run: pnpm e2e:ci-matrix
      - run: pnpm check:linux
      - run: pnpm build
      - run: xvfb-run -a pnpm test:smoke:built
      - run: pnpm test:bundle-budget
      - run: pnpm exec tsx scripts/assert-built-workspace.ts --channel development
      - name: Upload hash-validated Linux app build
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-${{ env.SALT_MARCHER_CHECKED_SHA }}-attempt-${{ github.run_attempt }}
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  linux-package:
    if: github.event_name == 'pull_request'
    name: Linux package · profile and AppImage
    needs: linux-build
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/download-artifact@v4
        with:
          name: linux-app-${{ env.SALT_MARCHER_CHECKED_SHA }}-attempt-${{ github.run_attempt }}
          path: out
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/assert-built-workspace.ts --channel development
      - run: pnpm package:development:built
      - run: xvfb-run -a pnpm test:packaged-smoke:built
      - run: pnpm build:local
      - run: pnpm package:local:built
      - run: xvfb-run -a pnpm test:packaged-local-smoke:built
      - run: pnpm candidate-artifact:write
      - name: Upload immutable Local handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: salt-marcher-local-${{ env.SALT_MARCHER_CHECKED_SHA }}-attempt-${{ github.run_attempt }}
          path: |
            release/local/*.AppImage
            release/local/*.AppImage.manifest.json
            release/local/candidate-artifact-receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux-qualification:
    if: github.event_name == 'pull_request'
    name: Linux qualification · packaged harness
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Cache native Electron toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: native-${{ runner.os }}-${{ runner.arch }}-node22-pnpm10-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:packaged-qualification-smoke

  e2e:
    if: github.event_name == 'pull_request'
    name: Linux E2E · ${{ matrix.shard }}
    needs: linux-build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.linux-build.outputs.functional_e2e_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/download-artifact@v4
        with:
          name: linux-app-${{ env.SALT_MARCHER_CHECKED_SHA }}-attempt-${{ github.run_attempt }}
          path: out
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/assert-built-workspace.ts --channel development
      - run: xvfb-run -a pnpm test:e2e:built -- --ci-shard "${{ matrix.shard }}"
        env:
          SALT_MARCHER_VISUAL_GOLDEN_VARIANT: ubuntu-24.04
      - name: Upload complete E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            .tmp/e2e-runs
            .tmp/visual-diffs
            .tmp/wdio-user-data
          if-no-files-found: error
          retention-days: 14

  visual:
    if: github.event_name == 'pull_request'
    name: Linux Visual · ${{ matrix.shard }}
    needs: linux-build
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.linux-build.outputs.visual_e2e_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/download-artifact@v4
        with:
          name: linux-app-${{ env.SALT_MARCHER_CHECKED_SHA }}-attempt-${{ github.run_attempt }}
          path: out
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/assert-built-workspace.ts --channel development
      - run: xvfb-run -a pnpm test:visual:built -- --ci-shard "${{ matrix.shard }}"
        env:
          SALT_MARCHER_VISUAL_GOLDEN_VARIANT: ubuntu-24.04
      - name: Upload complete visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            .tmp/e2e-runs
            .tmp/visual-diffs
            .tmp/wdio-user-data
          if-no-files-found: error
          retention-days: 14

  passive-e2e:
    if: github.event_name == 'pull_request'
    name: Linux E2E · passive window
    needs: linux-build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/download-artifact@v4
        with:
          name: linux-app-${{ env.SALT_MARCHER_CHECKED_SHA }}-attempt-${{ github.run_attempt }}
          path: out
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/assert-built-workspace.ts --channel development
      - run: xvfb-run -a pnpm test:passive-e2e:built

  exact-sha-aggregate:
    if: always() && github.event_name == 'pull_request'
    name: Candidate · exact-SHA aggregate
    needs:
      - portable
      - native
      - linux-build
      - linux-package
      - linux-qualification
      - e2e
      - visual
      - passive-e2e
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ env.SALT_MARCHER_CHECKED_SHA }}' }
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm delivery:verify-exact-sha-aggregate
        env:
          SALT_MARCHER_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SALT_MARCHER_NEEDS_JSON: ${{ toJSON(needs) }}

  post-promotion:
    if: github.event_name == 'push'
    name: Main · promotion/evidence attestation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SALT_MARCHER_CHECKED_SHA }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm delivery:verify-main-push
        env:
          GH_TOKEN: ${{ github.token }}
