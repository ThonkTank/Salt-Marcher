schema_version: 1
title: "SaltMarcher Quality Reset Requirements Ledger"
repository: "ThonkTank/Salt-Marcher"
baseline_sha: "c25c20a9ab574ee64c193d82db05c7fab7ae0f8c"
baseline_date: "2026-08-17"
allowed_statuses:
  - open
  - in_progress
  - verified
  - not_applicable
  - blocked
rules:
  verified_requires: "Commit-SHA, gezielten Beweis, aktuelle Dokumentation und Entfernung ersetzter Altpfade."
  not_applicable_requires: "Begründung, Live-SHA, strukturellen Alternativbeweis und gegebenenfalls Ersatz-ID."
  new_discovery_prefix: "DISC"
items:
  - id: PRES-001
    source: "Campaign/NPC-Kritik – Kurzurteil und Was gut funktioniert hat"
    requirement: "Renderer bleibt ohne Node-, Dateisystem- und Datenbankzugriff."
    acceptance: "Architekturtest und Runtime-Konfiguration verhindern direkten Rendererzugriff."
    evidence_required: "Architekturtest plus Electron-Security-Konfiguration auf finalem SHA."
    status: open
    evidence: []
    decision: null
  - id: PRES-002
    source: "Campaign/NPC-Kritik – Was gut funktioniert hat"
    requirement: "Alle IPC-Grenzen bleiben mit strikten Zod-Verträgen validiert und liefern immutable Resultate."
    acceptance: "Kein neuer unvalidierter Renderer/Main/Utility-Kanal; Negativtests bestehen."
    evidence_required: "Contract-/Architekturtests und Operations-Registry."
    status: open
    evidence: []
    decision: null
  - id: PRES-003
    source: "Alle Kritiken – positive Grundarchitektur"
    requirement: "Domainlogik, SQLite, Generatoren und Hintergrundarbeit bleiben im Utility-Prozess."
    acceptance: "Main und Renderer enthalten keine zurückverlagerte Fach- oder SQL-Logik."
    evidence_required: "Dependency-/Architekturtests."
    status: open
    evidence: []
    decision: null
  - id: PRES-004
    source: "Campaign/NPC-Kritik – Command Receipts"
    requirement: "Optimistische Revisionen, idempotente Command-Receipts und outcome_unknown-Reconciliation bleiben erhalten."
    acceptance: "Unterbrochene Writes werden nicht blind wiederholt und sind per Command-ID abgleichbar."
    evidence_required: "Crash-/Unknown-outcome-Integrationstests."
    status: open
    evidence: []
    decision: null
  - id: PRES-005
    source: "Campaign/NPC- und Sidebar-Kritik – Handoff-Sicherheit"
    requirement: "Backups, Fail-Closed-Migrationen, AppImage-Smoke und Installed-Runtime-Readback bleiben erhalten."
    acceptance: "Finaler Handoff belegt Backup, Migration, Installation und Readback desselben Artefakts."
    evidence_required: "Finales Handoff-Receipt mit Hashkette."
    status: open
    evidence: []
    decision: null
  - id: PRES-006
    source: "Loot-Kritik – Was gut ist"
    requirement: "ItemReference bleibt geschlossene Union; generierte Kombinationen bleiben run-eigene immutable Definitionen."
    acceptance: "Ledger kopiert keine Magic-/Rarity-/Wertmetadaten; Resolver liefert Definitionen."
    evidence_required: "Schema-/Migration-/Resolvertests."
    status: open
    evidence: []
    decision: null
  - id: PRES-007
    source: "Loot-Kritik – Was gut ist"
    requirement: "Generated Runs bleiben immutable und konkrete persistierte Resultate bleiben Replay-Autorität."
    acceptance: "Spätere Engine-/Katalogaktivierung verändert vorhandene Runs nicht."
    evidence_required: "Historische Run-Hydration und Katalogwechseltest."
    status: open
    evidence: []
    decision: null
  - id: PRES-008
    source: "Loot-Kritik – Was gut ist"
    requirement: "Group Commit und Distribution bleiben transaktional und idempotent; Loot bleibt aus LiveSessionSnapshot getrennt."
    acceptance: "Ein Commit ist atomar; Wiederholung dupliziert nichts; Session-Snapshot enthält kein Loot-Aggregat."
    evidence_required: "Transaktions-/Idempotenz- und Contracttests."
    status: open
    evidence: []
    decision: null
  - id: PRES-009
    source: "Sidebar-Kritik – positives Schlussurteil"
    requirement: "Axe, Golden Masters und Layout-Unit-Tests bleiben als gezielte Werkzeuge erhalten."
    acceptance: "Sie werden stabilisiert und fokussiert, nicht pauschal entfernt oder abgeschwächt."
    evidence_required: "Neue Suite-Struktur plus Beispiele real gefundener Fehler."
    status: in_progress
    evidence: []
    decision: null

  - id: GIT-001
    source: "Integration-State-Original – Commit-Historie"
    requirement: "Die Original-SHAs ef5b46f8f, 9f4d332d8 und c25c20a9a bleiben im main-Vorfahrenpfad erhalten."
    acceptance: "Kein Revert, History-Rewrite oder Verlust der Original-Commits."
    evidence_required: "git merge-base/ancestor Nachweis auf finalem main."
    status: in_progress
    evidence: []
    decision: null
  - id: GIT-002
    source: "Integration-State-Original – verwirrender Checkout"
    requirement: "Task-Branches verfolgen ihren tatsächlichen Upstream oder arbeiten als dokumentierter detached Worktree."
    acceptance: "Handoff lehnt falsche/alte Upstream-Zuordnung ab."
    evidence_required: "Git-Preflight-Test und Handoff-Receipt."
    status: in_progress
    evidence: []
    decision: null
  - id: GIT-003
    source: "Integration-State-Original – lokaler main 62 Commits zurück"
    requirement: "Lokaler main wird vor Nutzung fast-forward mit origin/main synchronisiert; Handoff verlässt sich nicht auf veralteten lokalen main."
    acceptance: "Baseline wird stets vom aufgelösten Remote-SHA erstellt."
    evidence_required: "Preflight-Code/Test mit veraltetem lokalen main."
    status: in_progress
    evidence: []
    decision: null
  - id: GIT-004
    source: "Sidebar-Kritik – parallele fremde Änderungen"
    requirement: "Fremde Worktree-Änderungen werden vor Prüfstart erkannt und niemals in Scope aufgenommen."
    acceptance: "Handoff arbeitet aus sauberem isoliertem Worktree und friert den SHA ein."
    evidence_required: "Dirty-/Concurrent-worktree-Test."
    status: in_progress
    evidence: []
    decision: null
  - id: GIT-005
    source: "Integration-State-Original – Änderungen trotz roter Checks auf main"
    requirement: "Ein Kandidaten-SHA wird remote grün geprüft, bevor main aktualisiert wird."
    acceptance: "Direkter unbewiesener Push nach main ist im kanonischen Ablauf nicht möglich."
    evidence_required: "Workflow-/Promotionbeweis auf finalem SHA."
    status: in_progress
    evidence: []
    decision: null

  - id: CI-001
    source: "Integration-State-Original – main ist rot"
    requirement: "main ist nach M0 und am Ende vollständig grün."
    acceptance: "Alle erforderlichen semantisch passenden Jobs bestehen auf main-HEAD."
    evidence_required: "GitHub-Actions-Lauf für finalen SHA."
    status: in_progress
    evidence: []
    decision: null
  - id: CI-002
    source: "Integration-State-Original – macOS/Windows AppImage-/proc-Fehler"
    requirement: "Linux-spezifische Profil-, AppImage- und /proc-Tests laufen nur unter Linux."
    acceptance: "Windows/macOS führen diese Tests nicht aus; portable Tests bleiben erhalten."
    evidence_required: "Workflowdiff plus grüne Plattformjobs."
    status: in_progress
    evidence: []
    decision: null
  - id: CI-003
    source: "Integration-State-Original – Fehler seit d8224d088"
    requirement: "Bekannte vorbestehende CI-Fehler werden als Baselineschuld behoben und nicht den drei Featurecommits zugeschrieben."
    acceptance: "Ursache und Einführungsstand sind dokumentiert; Reparatur ist eigenständig belegt."
    evidence_required: "Commit-/Blame-/Regressionstest."
    status: in_progress
    evidence: []
    decision: null
  - id: CI-004
    source: "Sidebar- und Loot-Kritik – teure vollständige Läufe"
    requirement: "Jeder Hauptslice besitzt einen schnellen offiziellen Checkpfad."
    acceptance: "Loot, World Planner, Campaign Import und Session UI haben fokussierte Checks mit gezielten Beweisen."
    evidence_required: "package scripts, Laufzeiten und CI-Jobs."
    status: in_progress
    evidence: []
    decision: null
  - id: CI-005
    source: "Campaign/NPC-Kritik – automatische Testauswahl und Parallelisierung"
    requirement: "Betroffene Tests werden anhand stabiler Abhängigkeiten ausgewählt; unabhängige E2E-Suites können parallel laufen."
    acceptance: "Änderungen starten passende Slice-Checks; Parallelisierung teilt keine Zustandsfixture."
    evidence_required: "Auswahltest, CI-Konfiguration und Laufzeitvergleich."
    status: in_progress
    evidence: []
    decision: null
  - id: CI-006
    source: "Loot-/Sidebar-Kritik – fehlende Fehlerdiagnostik"
    requirement: "Fehlläufe bewahren vollständige stdout/stderr-, Screenshot-, Diff- und Zustandsartefakte."
    acceptance: "Die Ursache eines absichtlich fehlschlagenden Tests ist ohne Reproduktionslauf erkennbar."
    evidence_required: "Artefaktbeispiel eines kontrollierten Fehlers."
    status: in_progress
    evidence: []
    decision: null

  - id: DOC-001
    source: "Campaign/NPC-Kritik – Schema 31 versus Zielarchitektur 29"
    requirement: "Aktuelle Schema-Matrix wird aus der Migrationsregistry erzeugt oder gegen sie geprüft."
    acceptance: "Code und Dokumentation weisen denselben Current-Wert und Pfad aus."
    evidence_required: "Generator/Gate plus Snapshot der Matrix."
    status: open
    evidence: []
    decision: null
  - id: DOC-002
    source: "Campaign/NPC-Kritik – mehrere aktuelle Wahrheiten"
    requirement: "CI lehnt abweichende aktuelle Schema-, Engine-, Config- oder Katalogangaben ab."
    acceptance: "Mutations-/Negativtest macht CI bei absichtlicher Drift rot."
    evidence_required: "Drift-Gate-Test."
    status: open
    evidence: []
    decision: null
  - id: DOC-003
    source: "Campaign/NPC-Kritik – historische Migrationsbeschreibungen"
    requirement: "Historische Dokumentation ist als historisch markiert und behauptet keinen aktuellen Stand."
    acceptance: "Suche findet keine konkurrierenden unmarkierten Current-Werte."
    evidence_required: "Dokumentationsaudit-Test."
    status: open
    evidence: []
    decision: null
  - id: DOC-004
    source: "Loot-Kritik – Sheet nicht reproduzierbar"
    requirement: "Die lokale Spezifikation enthält auch relevante Formeln/Entscheidungen, nicht nur exportierte TSV-Tabellen."
    acceptance: "Paritätsfälle sind ohne Zugriff auf das Live-Sheet reproduzierbar."
    evidence_required: "Rule-IR oder vollständige Oracle-Fixtures."
    status: open
    evidence: []
    decision: null
  - id: DOC-005
    source: "Alle Kritiken – redundante Wahrheiten"
    requirement: "Für jeden Fachfakt ist ein kanonischer Besitzer und eine Ableitungskette dokumentiert."
    acceptance: "TS-Defaults, TSV, UI-Metadaten und Dokumentation widersprechen sich nicht unabhängig."
    evidence_required: "Ownership-Dokument und automatischer Konsistenztest."
    status: open
    evidence: []
    decision: null

  - id: CONTRACT-001
    source: "Loot-Kritik – Command-Schema und historisches Run-Schema"
    requirement: "Neue Session-/Group-Reward-Commands besitzen verpflichtende aktuelle Eingaben."
    acceptance: "Fehlende Ledger-Basis ist statisch/vertraglich ungültig, nicht erst tief im Generator."
    evidence_required: "Zod-/Type-Contract-Negativtests."
    status: open
    evidence: []
    decision: null
  - id: CONTRACT-002
    source: "Loot-Kritik – historische Run-Lesbarkeit"
    requirement: "PersistedRewardV2 und neue Versionen sind als echte Versionsunion oder Upcaster lesbar."
    acceptance: "reward-v2-Runs hydrieren nach Einführung der neuen Engineversion weiterhin."
    evidence_required: "Historische Fixture-Hydration."
    status: open
    evidence: []
    decision: null
  - id: CONTRACT-003
    source: "Loot-Kritik – inkonsistente Fehlerbehandlung"
    requirement: "Session und Group Reward verwenden denselben typisierten Result-/Issue-Vertrag."
    acceptance: "Keine rohen Error-Strings für erwartbare Validierungsfehler."
    evidence_required: "Contracttests beider Pfade."
    status: open
    evidence: []
    decision: null
  - id: CONTRACT-004
    source: "Sidebar-Kritik – stille Normalisierung"
    requirement: "Validierung, benannte Migration und temporäre Laufzeitanpassung sind getrennt."
    acceptance: "Rohpräferenz, Migrationsergebnis und effective layout bleiben unterscheidbar."
    evidence_required: "Schema-/Migration-/Runtime-Fit-Tests."
    status: open
    evidence: []
    decision: null
  - id: CONTRACT-005
    source: "Campaign/NPC-Kritik – überbreite Revisionen"
    requirement: "Commands verlangen und erhöhen nur Revisionen tatsächlich berührter Aggregate."
    acceptance: "NPC-Notizsave scheitert nicht an unberührter Fraktionsrevision."
    evidence_required: "Concurrent-Revision-Integrationstest."
    status: open
    evidence: []
    decision: null
  - id: CONTRACT-006
    source: "Loot-Kritik – unabhängige Versionen"
    requirement: "Encounter Engine, Reward Engine, Config und Katalog besitzen unabhängige auditierbare Versionen."
    acceptance: "Änderung einer Dimension erzwingt nur deren korrekte Version und bewahrt die anderen."
    evidence_required: "Provenienz-/Versionierungstests."
    status: open
    evidence: []
    decision: null

  - id: IMPORT-001
    source: "Campaign/NPC-Kritik – Kampagnenimport keine Produktfähigkeit"
    requirement: "Ein versioniertes CampaignImportBundle ist dauerhaft eingecheckt und vertraglich definiert."
    acceptance: "Bundle enthält Quelle, Revision, Exporthash, Version und externe Schlüssel."
    evidence_required: "Schema und repräsentative Fixture."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-002
    source: "Campaign/NPC-Kritik – temporäres Skript"
    requirement: "Utility-Service bietet validate, preview und apply als Produktfähigkeiten."
    acceptance: "Ad-hoc-Skripte sind entfernt oder nur dünne Aufrufer dieses Services."
    evidence_required: "Application-/Integrationstests."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-003
    source: "Campaign/NPC-Kritik – unbekannte Statblocks/Dubletten/mehrdeutige Namen"
    requirement: "Preview liefert einen lesbaren strukturierten Konflikt- und Auflösungsbericht."
    acceptance: "Alle Konflikte erscheinen vor apply mit stabilen Codes und Quellpfaden."
    evidence_required: "Konfliktfixtures und Presenter-Test."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-004
    source: "Campaign/NPC-Kritik – gestagte Kampagne"
    requirement: "Import wird auf eine gestagte Kampagne angewendet und erst nach vollständigem Readback aktiviert."
    acceptance: "Fehler lässt aktive Kampagne unverändert; Erfolg aktiviert nur verifizierten Stand."
    evidence_required: "Crash-/Rollback-/Readback-Integrationstest."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-005
    source: "Campaign/NPC-Kritik – fehlende Provenienz"
    requirement: "Quell-ID, Revision, verwendete Abschnitte, Exporthash und Entscheidungen werden persistiert."
    acceptance: "Nach Import ist erklärbar, woher jede externe Zuordnung stammt."
    evidence_required: "Persistenzschema und Domain-Readback."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-006
    source: "Campaign/NPC-Kritik – Reimport und Hank-Sonderfall"
    requirement: "Externe Schlüssel machen Re- und Differenzimport idempotent."
    acceptance: "Doppelter Import erzeugt keine Dubletten; Ergänzung aktualisiert nur passende Entitäten."
    evidence_required: "Idempotenz-/Delta-Integrationstest."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-007
    source: "Campaign/NPC-Kritik – Zuordnung nur in Plan/Gespräch/Skript"
    requirement: "Sprach-, Rassen-, Orts-, Fraktions- und Statblockentscheidungen sind maschinenlesbar im Bundle oder Auflösungsmanifest."
    acceptance: "Kein entscheidungsrelevantes Mapping existiert nur als Gesprächsnotiz."
    evidence_required: "Fixture-/Manifestreview und Schema."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-008
    source: "Campaign/NPC-Kritik – wechselnde Quellrevisionen 5980/6005/6098"
    requirement: "Importer erkennt und berichtet Quellrevision-/Hashänderungen deterministisch."
    acceptance: "Delta zwischen zwei Quellen wird vor apply aufgelistet."
    evidence_required: "Zwei Revisionsfixtures und Preview-Test."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-009
    source: "Campaign/NPC-Kritik – fehlende Tower-of-Time-Fixture"
    requirement: "Eine wiederholbare reale Referenzimportfixture mit semantischem Golden Master ist eingecheckt."
    acceptance: "Fixture beweist Entitäten, Beziehungen, Provenienz und Reimport."
    evidence_required: "check:campaign-import."
    status: open
    evidence: []
    decision: null
  - id: IMPORT-010
    source: "Campaign/NPC-Kritik – inkompatibler Pflege-Worktree"
    requirement: "Wartungs-/Importbefehle laufen nur über kompatiblen installierten Utility-Stand oder den im Receipt benannten Deployment-SHA."
    acceptance: "Inkompatibler Worktree wird vor Profilzugriff abgewiesen."
    evidence_required: "Versionsmismatch-Negativtest."
    status: open
    evidence: []
    decision: null

  - id: WORLD-001
    source: "Campaign/NPC-Kritik – NPC/Fraktion Ownership"
    requirement: "Ownership der NPC-Fraktionsmitgliedschaft ist eindeutig benannt und durch Domain/API/SQL konsistent."
    acceptance: "Nur ein Owner mutiert die Relation; alle anderen nutzen Ports."
    evidence_required: "Architekturdokument, Dependencytest und Storetest."
    status: open
    evidence: []
    decision: null
  - id: WORLD-002
    source: "Campaign/NPC-Kritik – optionaler Fraktionskoordinator"
    requirement: "Membership-Port ist für mutierende World-Planner-Services verpflichtend."
    acceptance: "Keine Konfiguration, in der Reads funktionieren und Mutationen erst zur Laufzeit wegen fehlendem Port scheitern."
    evidence_required: "Konstruktionstyp-/Integrationstest."
    status: open
    evidence: []
    decision: null
  - id: WORLD-003
    source: "Campaign/NPC-Kritik – relationale Sicherungen"
    requirement: "NPC-location und faction-NPC-Relationen besitzen Foreign Keys und passende Delete-/Restrict-Semantik."
    acceptance: "Verwaiste IDs sind durch DB-Constraint unmöglich."
    evidence_required: "Migration plus FK-Negativtests."
    status: open
    evidence: []
    decision: null
  - id: WORLD-004
    source: "Campaign/NPC-Kritik – direkte creatureById-Abhängigkeit"
    requirement: "World Planner verwendet einen injizierten CreatureReferenceResolver-Port."
    acceptance: "Store importiert keine konkrete statische Creature-Quelle."
    evidence_required: "Dependencytest und Custom-Resolver-Test."
    status: open
    evidence: []
    decision: null
  - id: WORLD-005
    source: "Campaign/NPC-Kritik – EncounterSourceService Sammelservice"
    requirement: "World-Planner-Anwendungsfälle liegen in einem dedizierten Application Service."
    acceptance: "EncounterSourceService besitzt keine NPC-CRUD-Durchleitungen mehr."
    evidence_required: "Architekturtest und entfernte Methoden."
    status: open
    evidence: []
    decision: null
  - id: WORLD-006
    source: "Campaign/NPC-Kritik – Encounterquellen als Consumer"
    requirement: "Encounter-Quellenauflösung konsumiert schmale World-Planner-Projektionen statt den World Planner zu besitzen."
    acceptance: "Abhängigkeitsrichtung ist durch Ports und Tests erzwungen."
    evidence_required: "Dependency-/Applicationtest."
    status: open
    evidence: []
    decision: null

  - id: NPC-001
    source: "Campaign/NPC-Kritik – Ganzlisten-Snapshot"
    requirement: "NPC-Listen werden paginiert und enthalten keine großen Langtextdetails."
    acceptance: "NpcListPage ist begrenzt; NpcDetail lädt Textfelder erst bei Auswahl."
    evidence_required: "Contract, Querytest und Payloadmessung."
    status: open
    evidence: []
    decision: null
  - id: NPC-002
    source: "Campaign/NPC-Kritik – lokale Suche/Filter"
    requirement: "NPC-Suche und relevante Filterung erfolgen serverseitig; FTS5 kann hinter klarer Schwelle folgen."
    acceptance: "Renderer lädt nicht den gesamten Bestand zur Suche."
    evidence_required: "Query-/Controller-Test mit großer Fixture."
    status: open
    evidence: []
    decision: null
  - id: NPC-003
    source: "Campaign/NPC-Kritik – große Receipts"
    requirement: "NPC-Command-Receipts enthalten nur Ausgang, gespeicherte Entität und resultierende Revisionen."
    acceptance: "Keine vollständigen NPC-/Fraktionssnapshots in neuen Receipts."
    evidence_required: "Persistenz-/Payloadtest."
    status: open
    evidence: []
    decision: null
  - id: NPC-004
    source: "Campaign/NPC-Kritik – fehlende Retention"
    requirement: "Command-Receipt-Retention ist explizit, sicher und getestet."
    acceptance: "Wachstum ist begrenzt, ohne aktive Idempotenzfenster zu brechen."
    evidence_required: "Retentionpolicy und Alterungs-/Recoverytest."
    status: open
    evidence: []
    decision: null
  - id: NPC-005
    source: "Campaign/NPC-Kritik – rohe Creature-ID in UI"
    requirement: "NpcListPage liefert aufgelösten Statblock-Anzeigenamen."
    acceptance: "UI zeigt keinen rohen technischen Identifier als primäre Beschriftung."
    evidence_required: "Projection-/Renderer-Test."
    status: open
    evidence: []
    decision: null
  - id: NPC-006
    source: "Campaign/NPC-Kritik – fehlende Skalierungsschwellen"
    requirement: "Messbare Schwellen für Paging/FTS/Payload sind dokumentiert und durch repräsentative Fixture überwacht."
    acceptance: "Überschreitung löst Gate oder vorgesehenen Querypfad aus."
    evidence_required: "Profiltest mit Schwellenwerten."
    status: open
    evidence: []
    decision: null

  - id: REF-001
    source: "Campaign/NPC-Kritik – vollständiger Referenzzustand vorher/nachher"
    requirement: "Jeder erfolgreiche Befehl meldet exakt geänderte Referenzziele."
    acceptance: "Keine globale Vorher-/Nachher-Serialisierung bei lokaler Mutation."
    evidence_required: "Command-/Invalidierungstest."
    status: open
    evidence: []
    decision: null
  - id: REF-002
    source: "Campaign/NPC-Kritik – quadratische Invalidierung"
    requirement: "Ein Dependency Index bestimmt ausschließlich abhängige Ziele."
    acceptance: "Änderung eines NPC invalidiert nur direkt/indirekt betroffene Dokumente."
    evidence_required: "Invalidierungsset- und Skalierungstest."
    status: open
    evidence: []
    decision: null
  - id: REF-003
    source: "Campaign/NPC-Kritik – Utility-Kompositionsdatei"
    requirement: "Referenzindex/-recompute besitzt einen eigenen Owner außerhalb utility/application.ts."
    acceptance: "Utility-Komposition verdrahtet und veröffentlicht nur."
    evidence_required: "Architekturtest und Modulstruktur."
    status: open
    evidence: []
    decision: null
  - id: REF-004
    source: "Campaign/NPC-Kritik – abhängige Labels stale"
    requirement: "NPC-Projektion/Controller reagiert exakt auf NPC-, Fraktions-, Orts- und Creature-Änderungen."
    acceptance: "Externe Namensänderung aktualisiert sichtbare Labels ohne Vollreload."
    evidence_required: "Subscription-/Controller-Integrationstest."
    status: open
    evidence: []
    decision: null

  - id: PARTY-001
    source: "Campaign/NPC-Kritik – PartyStore vermischt Schichten"
    requirement: "PartyRoster-Domainmodell ist unabhängig von öffentlichen API-Schemas und SQL sichtbar."
    acceptance: "Domain importiert keine Shared-Contract-Schemas oder better-sqlite3."
    evidence_required: "Dependencytest und Domain-Unit-Tests."
    status: open
    evidence: []
    decision: null
  - id: PARTY-002
