appId: org.saltmarcher.app
productName: SaltMarcher
directories:
  output: release/release
files:
  - out/**
extraResources:
  - from: resources/reference
    to: reference
  - from: resources/sessiongeneration
    to: sessiongeneration
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
linux:
  target: [AppImage]
win:
  target: [nsis]
mac:
  target: [dmg]
