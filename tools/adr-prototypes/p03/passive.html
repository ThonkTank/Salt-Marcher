<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Party display</title>
    <link rel="stylesheet" href="passive.css" />
  </head>
  <body>
    <main aria-labelledby="scene-heading">
      <header>
        <p class="eyebrow">Party view</p>
        <h1 id="scene-heading" tabindex="-1">Waiting for a scene</h1>
        <p id="status" role="status" aria-live="polite">No released scene</p>
      </header>
      <section id="surface" aria-label="Released scene map">
        <div id="art" role="img" aria-label="No released art"></div>
        <ol id="markers" aria-label="Known locations"></ol>
      </section>
      <button
        id="details"
        type="button"
        aria-controls="legend"
        aria-expanded="false"
      >
        Show known locations
      </button>
      <section id="legend" aria-label="Known location legend" hidden></section>
    </main>
    <script src="passive-renderer.js"></script>
  </body>
</html>
